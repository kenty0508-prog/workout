<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>Workout Log</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;background:#f5f7fa;color:#111827}button,input,select{font:inherit}button{min-height:48px;border:0;border-radius:14px}.app{max-width:640px;margin:auto;padding:16px 14px 92px}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 16px}.title{font-weight:800;font-size:24px}.sub{font-size:12px;color:#6b7280}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}.tab{background:#e5e7eb;color:#374151;font-weight:700}.tab.on{background:#111827;color:#fff}.card{background:white;border:1px solid #e5e7eb;border-radius:20px;padding:16px;margin-bottom:12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:start}.muted{color:#6b7280;font-size:12px}.ex{font-size:21px;font-weight:800}.prev{font-weight:700;text-align:right}.goal{margin:14px 0;background:#eef2ff;border-radius:14px;padding:12px}.goal b{font-size:19px}.sets{display:grid;gap:9px}.set{display:grid;grid-template-columns:34px 1fr 1fr;gap:8px;align-items:center}.set input{width:100%;min-width:0;height:50px;border:1px solid #d1d5db;border-radius:12px;text-align:center;font-size:18px;background:#fff}.labels{font-size:11px;color:#6b7280}.actions{display:grid;grid-template-columns:1fr 1.6fr;gap:8px;margin-top:14px}.secondary{background:#e5e7eb}.primary{background:#111827;color:#fff;font-weight:800}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);border-top:1px solid #e5e7eb;padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px}.nav{width:min(31%,190px);background:#f3f4f6;font-size:13px}.nav.on{background:#111827;color:#fff}.hide{display:none}.historyItem{border-bottom:1px solid #eee;padding:11px 0}.big{font-size:28px;font-weight:850}.sharecard{background:#111827;color:#fff;border-radius:18px;padding:16px}.sharegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.metric{background:#1f2937;border-radius:12px;padding:10px}.metric b{font-size:18px}.note{font-size:12px;color:#d1d5db}.danger{background:#fee2e2;color:#991b1b;padding:10px;border-radius:12px;font-size:12px;margin-top:10px}.full{width:100%;margin-top:10px}textarea{width:100%;min-height:80px;border:1px solid #d1d5db;border-radius:12px;padding:10px;font:inherit}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#e5e7eb;font-size:12px;margin-right:4px}@media(max-width:360px){.app{padding-left:10px;padding-right:10px}.tab{font-size:12px}.ex{font-size:18px}}
</style></head><body><main class="app">
<div class="top"><div><div class="title">Workout Log</div><div class="sub" id="today"></div></div><div class="sub">端末内保存</div></div>
<section id="workoutView"><div class="tabs" id="tabs"></div><div class="card"><div class="row"><div><div class="muted" id="count"></div><div class="ex" id="exName"></div></div><div><div class="muted" style="text-align:right">前回</div><div class="prev" id="prev"></div></div></div><div class="goal"><div class="muted">今日の目標</div><b id="goal"></b></div><div class="set labels"><span></span><span style="text-align:center">重量 kg</span><span style="text-align:center">Reps</span></div><div class="sets" id="sets"></div><div style="margin-top:10px"><label class="muted">RIR</label><select id="rir" style="width:100%;height:48px;border:1px solid #d1d5db;border-radius:12px;padding:0 10px"><option value="">未入力</option><option>0</option><option>1</option><option selected>2</option><option>3</option><option>4+</option></select></div><div class="actions"><button class="secondary" id="back">← 前</button><button class="primary" id="save">保存して次へ</button></div></div><div class="card"><div class="muted">今日の進捗</div><div><span class="pill" id="progress"></span><span class="pill" id="volume"></span></div></div></section>
<section id="historyView" class="hide"><div class="card"><div class="row"><div><div class="muted">トレーニング履歴</div><div class="big" id="sessionCount">0回</div></div><button class="secondary" id="exportBtn">JSON出力</button></div><div id="historyList"></div></div></section>
<section id="shareView" class="hide"><div class="sharecard" id="shareCard"><div class="muted" style="color:#9ca3af">ChatGPTフィードバック用</div><div class="big">トレーニング記録</div><div id="shareDate" class="note"></div><div class="sharegrid"><div class="metric"><div class="note">直近セッション</div><b id="shareSession">—</b></div><div class="metric"><div class="note">総ボリューム</div><b id="shareVolume">—</b></div><div class="metric"><div class="note">Bench e1RM</div><b id="benchE">—</b></div><div class="metric"><div class="note">SQ / DL e1RM</div><b id="lowerE">—</b></div></div><div id="shareExercises" style="margin-top:14px"></div><div class="note" style="margin-top:12px">この画面をスクリーンショットしてChatGPTに送ってください。</div></div><div class="card"><div class="muted">フィードバック時に伝えたいこと</div><textarea id="memo" placeholder="例：ベンチ3セット目がかなり重かった。左胸の効きが弱い。"></textarea><button class="primary full" id="saveMemo">メモ保存</button></div></section>
</main><nav class="bottom"><button class="nav on" data-view="workoutView">トレーニング</button><button class="nav" data-view="historyView">履歴</button><button class="nav" data-view="shareView">共有用</button></nav>
<script>
const PROGRAM={
'Upper A':[['ベンチプレス',65,8],['インクラインベンチプレス',40,8],['ロー→ハイ ケーブルフライ',6.25,15],['サイドレイズ',6,15],['ディップス',0,10]],
'Upper B':[['アシストチンニング',0,8],['シーテッドロー',35,12],['フェイスプル',15,15],['サイドレイズ',6,15],['プリーチャーカール',17.5,8]],
'Lower A':[['バーベルスクワット',62.5,8],['レッグプレス',70,12],['シーテッドレッグカール',27.5,12],['アブドミナル',40,15]],
'Lower B':[['デッドリフト',77.5,8],['レッグプレス',70,12],['シーテッドレッグカール',28.5,12],['アブドミナル',40,12]]};
let state=JSON.parse(localStorage.getItem('workout-log-v1')||'{"logs":[],"memo":""}');let session='Upper A',idx=0;
const $=s=>document.querySelector(s);const dateStr=()=>new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'short',day:'numeric'});$('#today').textContent=dateStr();
function latest(name){for(let i=state.logs.length-1;i>=0;i--){const e=state.logs[i].exercises.find(x=>x.name===name);if(e)return e}return null}
function target(ex){const p=latest(ex[0]);if(!p)return {w:ex[1],r:ex[2]};const best=Math.max(...p.sets.map(s=>s.r));let w=p.sets[0].w,r=ex[2];if(best>=ex[2]){w=w===0?0:Math.round((w+(w<20?1:2.5))*4)/4}else r=Math.min(ex[2],best+1);return {w,r}}
function tabs(){const el=$('#tabs');el.innerHTML='';Object.keys(PROGRAM).forEach(n=>{const b=document.createElement('button');b.className='tab'+(n===session?' on':'');b.textContent=n;b.onclick=()=>{session=n;idx=0;render()};el.appendChild(b)})}
function render(){tabs();const list=PROGRAM[session],ex=list[idx],p=latest(ex[0]),t=target(ex);$('#count').textContent=`${idx+1} / ${list.length}`;$('#exName').textContent=ex[0];$('#prev').textContent=p?`${p.sets[0].w||'自重'}kg × ${Math.max(...p.sets.map(s=>s.r))}`:'未記録';$('#goal').textContent=`${t.w||'自重'}${t.w?'kg':''} × ${t.r}`;$('#sets').innerHTML='';for(let i=1;i<=3;i++){const d=document.createElement('div');d.className='set';d.innerHTML=`<b>${i}</b><input inputmode="decimal" type="number" step="0.25" min="0" value="${t.w||''}"><input inputmode="numeric" type="number" min="0" max="100" value="${t.r}">`;$('#sets').appendChild(d)}$('#back').disabled=idx===0;updateProgress()}
function activeLog(){const d=new Date().toISOString().slice(0,10);let l=state.logs.findLast?.(x=>x.date===d&&x.session===session);if(!l){for(let i=state.logs.length-1;i>=0;i--)if(state.logs[i].date===d&&state.logs[i].session===session){l=state.logs[i];break}}if(!l){l={date:d,session,exercises:[]};state.logs.push(l)}return l}
$('#save').onclick=()=>{const ex=PROGRAM[session][idx],rows=[...$('#sets').children],sets=rows.map(r=>({w:+r.children[1].value||0,r:+r.children[2].value||0}));const log=activeLog();const old=log.exercises.findIndex(x=>x.name===ex[0]);const item={name:ex[0],sets,rir:$('#rir').value};if(old>=0)log.exercises[old]=item;else log.exercises.push(item);persist();if(idx<PROGRAM[session].length-1)idx++;render()};$('#back').onclick=()=>{if(idx>0){idx--;render()}};
function persist(){localStorage.setItem('workout-log-v1',JSON.stringify(state));updateProgress();renderHistory();renderShare()}
function updateProgress(){const d=new Date().toISOString().slice(0,10),l=state.logs.find(x=>x.date===d&&x.session===session),done=l?l.exercises.length:0;$('#progress').textContent=`${done}/${PROGRAM[session].length} 種目`;let v=0;if(l)l.exercises.forEach(e=>e.sets.forEach(s=>v+=s.w*s.r));$('#volume').textContent=`${Math.round(v).toLocaleString()} kg`}
function renderHistory(){const box=$('#historyList');box.innerHTML='';$('#sessionCount').textContent=state.logs.length+'回';[...state.logs].reverse().slice(0,20).forEach(l=>{const v=l.exercises.reduce((a,e)=>a+e.sets.reduce((x,s)=>x+s.w*s.r,0),0);const d=document.createElement('div');d.className='historyItem';d.innerHTML=`<div class="row"><b>${l.date} · ${l.session}</b><span>${Math.round(v).toLocaleString()}kg</span></div><div class="muted">${l.exercises.map(e=>e.name).join(' / ')}</div>`;box.appendChild(d)})}
function e1(name){const p=latest(name);if(!p)return null;let best=0;p.sets.forEach(s=>best=Math.max(best,s.w*(1+s.r/30)));return best?best.toFixed(1):null}
function renderShare(){const l=state.logs[state.logs.length-1];$('#shareDate').textContent=dateStr();$('#shareSession').textContent=l?l.session:'—';let v=0;if(l)l.exercises.forEach(e=>e.sets.forEach(s=>v+=s.w*s.r));$('#shareVolume').textContent=l?Math.round(v).toLocaleString()+' kg':'—';$('#benchE').textContent=e1('ベンチプレス')?e1('ベンチプレス')+' kg':'—';const sq=e1('バーベルスクワット'),dl=e1('デッドリフト');$('#lowerE').textContent=`${sq||'—'} / ${dl||'—'} kg`;$('#shareExercises').innerHTML=l?l.exercises.map(e=>`<div style="margin:8px 0"><b>${e.name}</b><div class="note">${e.sets.map(s=>`${s.w||'自重'}${s.w?'kg':''}×${s.r}`).join(' ｜ ')}${e.rir?' · RIR '+e.rir:''}</div></div>`).join(''):'まだ記録がありません';$('#memo').value=state.memo||''}
$('#saveMemo').onclick=()=>{state.memo=$('#memo').value.slice(0,500);persist();alert('保存しました')};$('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='workout-log.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('main section[id$="View"]').forEach(v=>v.classList.add('hide'));$('#'+b.dataset.view).classList.remove('hide');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('on',x===b));if(b.dataset.view==='shareView')renderShare()});
render();renderHistory();renderShare();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
